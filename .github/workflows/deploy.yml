name: Deploy Backend

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-log-production-deploy
      cancel-in-progress: true
    env:
      TARGET_DIR: /opt/build-log-test-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            mkdir -p "${{ env.TARGET_DIR }}"
            mkdir -p "${{ env.TARGET_DIR }}/docker"
            mkdir -p "${{ env.TARGET_DIR }}/prisma"
            mkdir -p "${{ env.TARGET_DIR }}/src"
            if [ ! -f "${{ env.TARGET_DIR }}/.env" ]; then
              echo ".env file was not found in ${{ env.TARGET_DIR }}"
              echo "Create it manually on the server before the first deploy."
              exit 1
            fi

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: ".dockerignore,.gitignore,Dockerfile,README.md,docker-compose.yml,docker,package.json,pnpm-lock.yaml,prisma,prisma.config.ts,src,tsconfig.build.json,tsconfig.json"
          target: "${{ env.TARGET_DIR }}"
          strip_components: 0

      - name: Rebuild and restart docker compose stack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ env.TARGET_DIR }}"
            docker compose up -d --build --remove-orphans
            docker compose ps
